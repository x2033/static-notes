<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A.T.L.A.S</title><meta name="robots" content="noindex"><meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#ededee;font-family:Inter,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;overflow:hidden;background:radial-gradient(900px 520px at 50% 30%,#10130c 0%,#000 65%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
form{position:relative;z-index:1;width:100%;max-width:400px;background:linear-gradient(180deg,#0d0d0f,#08080a);border:1px solid #1f1f23;border-radius:16px;padding:32px 28px 26px;box-shadow:0 0 0 1px #b6ff5c0f,0 30px 80px #000,0 0 60px #b6ff5c08;overflow:hidden}
form:before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,#b6ff5c66,transparent)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rad{width:30px;height:30px;border-radius:50%;border:1px solid #2b2b2f;position:relative;overflow:hidden;flex:none}
.rad:before{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid #23232a}
.rad i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#b6ff5c;box-shadow:0 0 8px #b6ff5c}
.rad:after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 290deg,#b6ff5c 360deg);opacity:0}
.busy .rad:after{opacity:.85;animation:sp 1.1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.wm{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:26px;letter-spacing:.32em;color:#ededee}
.wm b{color:#b6ff5c;font-weight:600}
.sub{font-size:13px;color:#8a8a91;margin:0 0 18px}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:#b6ff5c;background:#b6ff5c0d;border:1px solid #b6ff5c40;border-radius:999px;padding:5px 11px;margin-bottom:22px}
.badge i{width:7px;height:7px;border-radius:50%;background:#b6ff5c}
label.l{display:block;font-size:12px;color:#8a8a91;margin-bottom:8px;letter-spacing:.04em}
#p{width:100%;font:500 16px 'JetBrains Mono',monospace;color:#ededee;background:#050506;border:1px solid #2b2b2f;border-radius:10px;padding:13px 14px;outline:none;transition:border .15s,box-shadow .15s}
#p:focus{border-color:#b6ff5c;box-shadow:0 0 0 3px #b6ff5c1f}
.tg{display:flex;align-items:center;justify-content:space-between;margin:16px 0 20px;font-size:14px;color:#c4c4ca;cursor:pointer;user-select:none}
.tg input{position:absolute;opacity:0;width:0;height:0}
.sw{width:40px;height:22px;border-radius:999px;background:#1f1f23;position:relative;transition:background .2s;flex:none}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#8a8a91;transition:transform .2s,background .2s}
.tg input:checked+.sw{background:#b6ff5c55}.tg input:checked+.sw:after{transform:translateX(18px);background:#ededee}
.tg input:focus-visible+.sw{outline:2px solid #b6ff5c;outline-offset:2px}
button{width:100%;font:600 15px Inter,sans-serif;letter-spacing:.04em;color:#0a1200;background:linear-gradient(180deg,#c8ff7a,#b6ff5c);border:0;border-radius:10px;padding:14px;cursor:pointer;box-shadow:0 0 24px #b6ff5c30;transition:filter .15s,transform .05s,box-shadow .2s}
button:hover{filter:brightness(1.06);box-shadow:0 0 34px #b6ff5c45}button:active{transform:translateY(1px)}
.busy button{opacity:.75;cursor:progress}
.prog{height:2px;margin-top:12px;background:#151518;border-radius:2px;overflow:hidden;opacity:0}.prog i{display:block;width:30%;height:100%;background:#b6ff5c}
.busy .prog{opacity:1}.busy .prog i{animation:pr 1.2s ease-in-out infinite}@keyframes pr{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
#e{min-height:20px;margin-top:12px;font-size:13px;color:#ff5d6c;text-align:center}
.ft{margin-top:18px;padding-top:14px;border-top:1px solid #18181b;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#5f5f66;letter-spacing:.08em;display:flex;justify-content:space-between}
@media (max-width:420px){form{padding:26px 20px 22px;border-radius:14px}.wm{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<svg id="bg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1440 900" aria-hidden="true"><defs>
<pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<radialGradient id="v" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000"/></radialGradient></defs>
<rect width="1440" height="900" fill="url(#g)"/><rect width="1440" height="900" fill="url(#v)"/></svg>
<form id="f" autocomplete="on">
<div class="brand"><span class="rad" aria-hidden="true"><i></i></span><div class="wm">A<b>.</b>T<b>.</b>L<b>.</b>A<b>.</b>S</div></div>
<p class="sub">Trading desk · secure access</p>
<div class="badge"><i></i>PRACTICE · PAPER MONEY</div>
<label class="l" for="p">Password</label>
<input id="p" type="password" autocomplete="current-password" placeholder="Enter your password" autofocus>
<label class="tg" for="r"><span>Remember on this device</span><input type="checkbox" id="r" checked><span class="sw"></span></label>
<button type="submit">Unlock dashboard</button>
<div class="prog" aria-hidden="true"><i></i></div><div id="e" role="alert"></div>
<div class="ft"><span>AES-256 · ENCRYPTED</span><span>PBKDF2 · 600k</span></div>
</form>
<script>
(function(){
const SALT='4679f31964ee821f5f3efbcd181fa9a0',RAW='https://raw.githubusercontent.com/x2033/static-notes/',API='https://api.github.com/repos/x2033/static-notes/commits/data',KS='sn_key';
const MAP={'d':'d.enc','events.json':'events.enc','live.json':'live.enc'};
const hx=h=>new Uint8Array(h.match(/../g).map(b=>parseInt(b,16)));
const ofetch=window.fetch.bind(window);let KEY=null;
async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:hx(SALT),iterations:600000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt'])}
async function imp(raw){return crypto.subtle.importKey('raw',Uint8Array.from(atob(raw),c=>c.charCodeAt(0)),'AES-GCM',false,['decrypt'])}
let SHA=localStorage.getItem('sn_sha')||'data',SHAT=0,SP=null;let OK=Date.now();async function sha(){if(Date.now()-SHAT<65000)return SHA;if(SP)return SP;SP=(async()=>{try{const r=await ofetch(API+'?t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github.sha'},signal:AbortSignal.timeout?AbortSignal.timeout(10000):undefined});if(r.ok){SHA=(await r.text()).trim();SHAT=OK=Date.now();try{localStorage.setItem('sn_sha',SHA)}catch(_){}}else SHAT=Date.now()-35000}catch(e){SHAT=Date.now()-35000}if(Date.now()-OK>300000)SHA='data';SP=null;return SHA})();return SP}
async function getEnc(name){const r=await ofetch(RAW+(await sha())+'/'+name,{cache:'force-cache'});if(!r.ok)throw r.status;
 const b=Uint8Array.from(atob((await r.text()).trim()),c=>c.charCodeAt(0));
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12)))}
window.fetch=function(u,o){try{const url=new URL(typeof u==='string'?u:u.url,location.href);
 if(url.origin===location.origin){const f=url.pathname.split('/').pop();const k=(url.pathname===location.pathname||f===''||f==='index.html'||f==='dashboard.html')?'d':MAP[f]?f:null;
  if(k&&KEY)return getEnc(MAP[k]).then(t=>new Response(t,{status:200,headers:{'Content-Type':k==='d'?'text/html':'application/json'}}),s=>new Response('',{status:typeof s==='number'?s:503}))}}catch(e){}
 return ofetch(u,o)};
async function open_(){const h=await getEnc('d.enc');document.open();document.write(h);document.close()}
async function tryKey(raw){KEY=await imp(raw);await open_()}
const saved=localStorage.getItem(KS)||sessionStorage.getItem(KS);
if(saved)tryKey(saved).catch(()=>{localStorage.removeItem(KS);sessionStorage.removeItem(KS);KEY=null});
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='Unlocking…';document.getElementById('f').classList.add('busy');
 try{const k=await derive(document.getElementById('p').value);const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',k))));
  const rem=document.getElementById('r').checked;KEY=k;(rem?localStorage:sessionStorage).setItem(KS,raw);await open_();}
 catch(x){KEY=null;localStorage.removeItem(KS);sessionStorage.removeItem(KS);document.getElementById('f').classList.remove('busy');e.textContent=x===404||typeof x==='number'?'The desk data is unavailable right now (error '+x+'). Please try again in a minute.':'That password didn\'t work. Please check it and try again.'}};
})();
</script></body></html>
